name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04_produto_educacional/site/package-lock.json

      - name: Instalar dependências
        working-directory: 04_produto_educacional/site
        run: npm ci

      - name: Gerar versão pública do site
        working-directory: 04_produto_educacional/site
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: 04_produto_educacional/site/dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
